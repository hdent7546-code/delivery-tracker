<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty Express</title>
<style>
  :root{
    --pink:#ff8fb8; --pink-deep:#e8508a; --pink-soft:#ffe3ee; --cream:#fff8fb;
    --ink:#4a2a3a; --muted:#9a7384; --stone:#f6c9da; --stone-done:#e8508a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#ffe9f2 0%,#fff8fb 45%,#ffeef5 100%);
    color:var(--ink); min-height:100vh; padding-block:20px 60px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); background-color:#ffeef5;
  }
  .wrap{max-width:460px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{font-weight:800;color:var(--pink-deep);letter-spacing:.3px;font-size:1.15rem}
  .brand span{font-weight:500;color:var(--muted)}
  .order{font-size:.75rem;color:var(--muted)}

  .card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(232,80,138,.12)}
  .status{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--pink-deep);box-shadow:0 0 0 0 rgba(232,80,138,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(232,80,138,0)}100%{box-shadow:0 0 0 0 rgba(232,80,138,0)}}
  .status b{font-size:1.05rem}
  .eta{margin-top:2px;font-size:.85rem;color:var(--muted)}
  .eta strong{color:var(--pink-deep)}

  .product{display:flex;gap:14px;align-items:center;margin-top:6px}
  .thumb{width:132px;aspect-ratio:600/377;border-radius:16px;overflow:hidden;background:var(--pink-soft);flex:none;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--pink-soft)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{font-size:.7rem;color:var(--muted);text-align:center;padding:8px;line-height:1.3}
  .pinfo h2{font-size:1rem;margin-bottom:4px}
  .pinfo p{font-size:.8rem;color:var(--muted);line-height:1.4}

  h3.sec{margin:26px 4px 6px;font-size:.8rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}

  /* stepping stones */
  .path{position:relative;display:flex;flex-direction:column;padding:6px 0 4px}
  .step{position:relative;display:flex;align-items:center;gap:14px;min-height:92px;width:82%}
  .step:nth-child(even){align-self:flex-end;flex-direction:row-reverse;text-align:right}
  .stone{
    position:relative;
    width:64px;height:48px;flex:none;border-radius:50% 46% 52% 48% / 58% 50% 50% 42%;
    background:var(--stone);display:flex;align-items:center;justify-content:center;
    font-size:1.25rem;box-shadow:0 5px 0 #e9a9c2, 0 10px 14px rgba(232,80,138,.18);
    transition:transform .2s;
  }
  .step.done .stone{background:var(--stone-done);box-shadow:0 5px 0 #b93a6c, 0 10px 14px rgba(232,80,138,.3);color:#fff}
  .step.now .stone{animation:hop 1.6s ease-in-out infinite;background:#ff6aa2;box-shadow:0 5px 0 #c4407a, 0 12px 18px rgba(232,80,138,.4)}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .step .txt b{display:block;font-size:.92rem}
  .step .txt small{font-size:.75rem;color:var(--muted)}
  .step.todo .txt{opacity:.7}
  .you{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:800;background:var(--ink);color:#fff;border-radius:99px;padding:2px 8px;white-space:nowrap}
  /* hopping trail */
  .trail{position:absolute;left:50%;top:30px;bottom:50px;width:0;border-left:3px dotted #f3b3cb;transform:translateX(-50%);z-index:0}
  .step{z-index:1}

  /* floating apology line */
  .float{
    margin-top:22px;background:#fff;border-radius:20px;padding:16px;
    box-shadow:0 14px 30px rgba(232,80,138,.22);border:2px dashed #ffb6d1;
    animation:bob 4s ease-in-out infinite;text-align:center;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .float p{font-size:.95rem;line-height:1.5;font-style:italic}
  .lilies{margin:12px auto 0;width:100%;max-width:300px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--pink-soft);
    display:flex;align-items:center;justify-content:center}
  .lilies img{width:100%;height:100%;object-fit:cover;display:block}

  footer{margin-top:30px;text-align:center;font-size:.7rem;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .txt,.pinfo{min-width:0}
  :root{color-scheme:light}
</style>
</head>

<script>
  // ---- Edit these ----
  const ORDER_ID = "KE-1217-2026";
  const START    = new Date(2026, 10, 23);   // 23 Nov 2026
  const DELIVERY = new Date(2026, 11, 17);   // 17 Dec 2026
  const TODAY_OVERRIDE = null;               // e.g. new Date(2026,11,5) to preview; null = real date
  const STEPS = [
    {d:new Date(2026,10,23), icon:"📝", t:"Order placed",          s:"We got your order"},
    {d:new Date(2026,10,29), icon:"🎀", t:"Packed",      s:"Ready to go"},
    {d:new Date(2026,11, 5), icon:"🚚", t:"Left the warehouse",    s:"The long road begins"},
    {d:new Date(2026,11,11), icon:"🏙️", t:"Crossing your city",    s:"Almost in range"},
    {d:new Date(2026,11,16), icon:"🛵", t:"Out for delivery",      s:"One hop away"},
    {d:new Date(2026,11,17), icon:"🎁", t:"Delivered",             s:"Arrives at your door"}
  ];
  // --------------------

  const fmt = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const today = TODAY_OVERRIDE || new Date();
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  document.getElementById("orderId").textContent = "Order #" + ORDER_ID;
  document.getElementById("etaText").textContent = DELIVERY.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  let cur = 0;
  STEPS.forEach((s,i)=>{ if (s.d <= t0) cur = i; });
  if (t0 < START) cur = 0;

  const days = Math.round((DELIVERY - t0)/86400000);
  document.getElementById("countdown").textContent =
    days > 0 ? days + (days===1?" day":" days") + " to go" : "today!";
  document.getElementById("statusText").textContent =
    cur === STEPS.length-1 ? "Delivered" : STEPS[cur].t;

  const path = document.getElementById("path");
  STEPS.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "step " + (i<cur?"done":i===cur?"now":"todo");
    el.innerHTML =
      '<div class="stone">' + (i===cur?'<span class="you">YOU ARE HERE</span>':'') + s.icon + '</div>' +
      '<div class="txt"><b>' + s.t + '</b><small>' + fmt(s.d) + ' · ' + s.s + '</small></div>';
    path.appendChild(el);
  });
</script>
